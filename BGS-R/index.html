<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>BGS&R</title>
  </head>
  <body>
    <div id="map"></div>
    <div id="controle">
      <input id="busca" type="text" placeholder="Buscar município..." autocomplete="off" />
      <div id="resultados"></div>
      <label>Indicador
        <select id="ind">
          <option value="">Nenhum</option>
          <option value="pop">População</option>
          <option value="dens">Densidade</option>
        </select>
      </label>
      <div id="raio-box">        <button id="raio-btn" type="button">Raio</button>        <select id="raio-km">          <option value="50">50 km</option>          <option value="100" selected>100 km</option>          <option value="200">200 km</option>        </select>      </div>
      <div id="legenda"></div>
    </div>
    <aside id="panel"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
